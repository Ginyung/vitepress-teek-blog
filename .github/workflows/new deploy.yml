name: Deploy VitePress to My Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Pre build
        run: pnpm stub

      - name: Build VitePress
        run: pnpm docs:build

      # ==============================================
      # ✅ 终极方案：使用 SSH Agent，永不报错 libcrypto
      # ==============================================
      - name: Start SSH Agent
        run: |
          eval $(ssh-agent -s)
          echo "${{ secrets.SERVERSSHKEY }}" | tr -d '\r' | ssh-add -
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

      - name: Add Server to Known Hosts
        run: |
          ssh-keyscan -p ${{ secrets.SERVERPORT }} ${{ secrets.SERVERHOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via RSYNC (SSH AGENT)
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SERVERPORT }}" \
            docs/.vitepress/dist/ \
            ${{ secrets.SERVERUSER }}@${{ secrets.SERVERHOST }}:/srv/vitepress-site/current/
